layout: default
title: Blog
<link rel="stylesheet" href="{{ './styles.css' | relative_url }}">
<h1>My Blog</h1>

<div class="blog-posts">
  {% for post in site.posts %}
    <div class="post-box">
      <a href="{{ post.url | relative_url }}">
        <h2>{{ post.title }}</h2>
        <p>{{ post.date | date: "%B %d, %Y" }}</p>
      </a>
    </div>
  {% endfor %}
</div>
```
